name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: self-hosted
    container:
      image: node:24-bookworm-slim

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{secrets.JWT_SECRET}}

      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      JWT_EXPIRES_IN: 7d

      WORKER_PORT: 3001
      WORKER_HOST: 0.0.0.0
      WORKER_CONCURRENCY: 1

      E2E_API_URL: http://localhost:3000

      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      AWS_REGION: ap-south-1
      S3_DATASET_PREFIX: storage/dataset
      S3_OUTPUT_PREFIX: outputs

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: export_service
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d export_service"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Add OpenSSL
        run: |
          apt-get update \
          && apt-get install -y openssl ca-certificates curl \
          && rm -rf /var/lib/apt/lists/*

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Setup PNPM cache
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

      - name: Build
        run: pnpm build

      - name: Unit Tests
        run: pnpm test:unit

      - name: Write .env for tests
        run: |
          echo "DATABASE_URL=${DATABASE_URL}" > .env
          echo "REDIS_URL=${REDIS_URL}" >> .env
          echo "JWT_SECRET=${JWT_SECRET}" >> .env
          echo "NODE_ENV=${NODE_ENV}" >> .env

      - name: Prisma generate + push
        run: |
          pnpm db:generate
          pnpm db:push

      - name: Integration tests
        run: |
          pnpm --filter @repo/api test:integration
          pnpm --filter @repo/worker test:integration

      - name: Configure AWS Creds
        uses: aws-actions/configure-aws-credentials@v4
        with:     
          aws-access-key-id: ${{ secrets.SEED_HOST_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SEED_HOST_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Seed Dataset
        run: pnpm --filter @repo/prisma db:seed

      - name: E2E test
        run: |
          pnpm --filter @repo/api start &
          pnpm --filter @repo/worker start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health; then
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3000/health || { echo "API failed to become healthy"; exit 1; }
          pnpm --filter @repo/api test:e2e

      - name: Cleanup workspace
        if: always()
        run: |
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
