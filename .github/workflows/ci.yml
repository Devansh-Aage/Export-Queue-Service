name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: self-hosted
    container:
      image: node:20-bookworm-slim

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{secrets.JWT_SECRET}}

      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      JWT_EXPIRES_IN: 7d

      WORKER_PORT: 3001
      WORKER_HOST: 0.0.0.0
      WORKER_CONCURRENCY: 1

      E2E_API_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: export_service
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d export_service"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install Deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

      - name: Build
        run: pnpm build

      - name: Unit Tests
        run: pnpm test:unit

      - name: Write .env for tests
        run: |
          cat > .env << EOF
          DATABASE_URL=${DATABASE_URL}
          REDIS_URL=${REDIS_URL}
          JWT_SECRET=${JWT_SECRET}
          NODE_ENV=${NODE_ENV}
          EOF

      - name: Prisma generate + push
        run: |
          pnpm db:generate
          pnpm db:push

      - name: Integration tests
        run: |
          pnpm --filter @repo/api test:integration
          pnpm --filter @repo/worker test:integration

      - name: Cleanup workspace
        if: always()
        run: |
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
