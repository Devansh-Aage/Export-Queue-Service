name: Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build image
        run: |
          docker build \
            -t export-service-api:ci-${{ github.sha }} \
            .
